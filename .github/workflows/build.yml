name: build

# Builds the SigLIP embedder image and pushes to GHCR.
#
# Triggers:
#   * push to main          → tags  :main, :sha-<short>
#   * push tag v*           → tags  :vX.Y.Z, :X.Y.Z, :latest
#   * pull_request          → build-only, no push (sanity check)
#   * workflow_dispatch     → manual run with optional MODEL_ID override

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id to bake into the image
        default: google/siglip2-so400m-patch14-384
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free up runner disk before building. PyTorch CUDA base + SigLIP weights
      # easily push the final image past 7 GB; default ubuntu-latest only has
      # ~14 GB free on /. This reclaims ~25 GB by deleting toolchains the build
      # does not need.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MODEL_ID=${{ github.event.inputs.model_id || 'google/siglip2-so400m-patch14-384' }}
